[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"

[project]
name="cais-stability"
version="0.1.0.dev0"
description="Governance stability and recoverability benchmarks for Controlled Agentic AI Systems."
readme="README.md"
requires-python=">=3.11"
dependencies=[]

[project.optional-dependencies]
dev=["mypy>=1.15","pytest>=8.3","ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages=["src/cais_stability"]

[tool.ruff]
target-version="py311"
line-length=100

[tool.ruff.lint]
select=["E","F","I","B","UP","SIM","RUF"]

[tool.mypy]
python_version="3.11"
strict=true
packages=["cais_stability"]
mypy_path="src"

[tool.pytest.ini_options]
testpaths=["tests"]

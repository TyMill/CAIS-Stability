name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Smoke verification
        run: python scripts/verify.py
      - name: Article pipeline smoke test
        run: |
          python scripts/run_article_experiments.py --seeds 1 --horizon 30 --intensities 0.5 --output /tmp/cais-raw.csv
          python scripts/build_article_outputs.py --input /tmp/cais-raw.csv --output /tmp/cais-summary.csv
          test -s /tmp/cais-summary.csv
